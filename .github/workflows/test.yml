name: Test
 
on:
  push:
    # Run this workflow on every branch so required checks don't fail without executing
    branches:
      - '**'
  pull_request:
    branches: [ latest, main ]

env:
  HAS_MOPAR_SECRETS: ${{ secrets.MOPAR_EMAIL != '' && secrets.MOPAR_PASSWORD != '' && secrets.MOPAR_PIN != '' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit:
    name: Unit tests (Node ${{ matrix.node-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Run unit tests
        run: npm run test:unit -- --ci --coverage --maxWorkers=2
      - name: Upload unit coverage
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage

  integration:
    name: Integration tests
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:integration -- --ci --maxWorkers=2

  e2e-smoke:
    name: E2E smoke tests
    needs: integration
    if: ${{ env.HAS_MOPAR_SECRETS == 'true' }}
    runs-on: ubuntu-latest
    env:
      MOPAR_EMAIL: ${{ secrets.MOPAR_EMAIL }}
      MOPAR_PASSWORD: ${{ secrets.MOPAR_PASSWORD }}
      MOPAR_PIN: ${{ secrets.MOPAR_PIN }}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:e2e -- --ci --runInBand

  coverage:
    name: Upload coverage
    needs: [unit, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: coverage
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
